
workflows:
  paki-android:
    name: PAKI Android APK
    max_build_duration: 60
    instance_type: linux_x2

    scripts:
      - name: Extract Android project
        script: |
          set -e
          unzip -o PAKI-Android-Project.zip -d paki_src
          cd paki_src
          gradle --version
          gradle assembleDebug

    artifacts:
      - "paki_src/app/build/outputs/apk/**/*.apk"
      
